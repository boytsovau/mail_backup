# Тесты и проверка установщика на каждый push в main и на pull request
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # restic из репозитория Ubuntu — как ставит install.sh; без него тест с настоящим restic пропускается
      - name: Установка restic
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q restic
          restic version
      - name: Установка приложения
        run: pip install -e '.[dev]'
      - name: pytest
        run: pytest -ra

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: bash -n
        run: bash -n deploy/install.sh && bash -n deploy/dovecot-listen.sh
      - name: shellcheck
        run: shellcheck deploy/install.sh deploy/dovecot-listen.sh
