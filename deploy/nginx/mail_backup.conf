# nginx перед веб-панелью mail_backup. Плейсхолдеры @...@ подставляет deploy/install.sh.

# HTTP → HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     @SSL_CERT@;
    ssl_certificate_key @SSL_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mail_backup:1m;

    server_tokens off;
    # Панели не нужны загрузки файлов
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:@WEB_PORT@;
        proxy_set_header Host $host;
        # Заменяем, а не дописываем: клиент не должен подделать свой IP
        # (по нему работает защита от перебора пароля)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
