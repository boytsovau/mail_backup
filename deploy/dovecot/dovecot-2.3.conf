# Dovecot 2.3 (Ubuntu 24.04 и старше) — локальное хранилище бэкапов mail_backup.
# Заменяет /etc/dovecot/dovecot.conf целиком: на этом сервере Dovecot
# нужен только как хранилище, внешняя почта через него не ходит.
#
# Плейсхолдеры @...@ подставляет deploy/install.sh.
# Раскладка хранилища та же, что в dovecot-2.4.conf: при обновлении Dovecot
# бэкапы остаются на месте.

protocols = imap

# Только локальный доступ: подключается лишь imapsync с этого же сервера
listen = 127.0.0.1
ssl = no
# Пароль в открытом виде допустим: соединение не покидает машину
disable_plaintext_auth = no

# Maildir — по файлу на письмо: удобно для restic (дедупликация, инкременты).
# LAYOUT=fs — иерархия папок каталогами с разделителем «/», как у Яндекса и Mail.ru
mail_location = maildir:~/Maildir:LAYOUT=fs

# Все ящики принадлежат пользователю сервиса — он же делает снимки restic
mail_uid = @SERVICE_USER@
mail_gid = @SERVICE_USER@
first_valid_uid = @SERVICE_UID@
last_valid_uid = @SERVICE_UID@

namespace inbox {
  inbox = yes
  separator = /
}

# Учётки ящиков генерирует приложение (mail-backup dovecot-sync)
passdb {
  driver = passwd-file
  args = @DATA_DIR@/dovecot/users
}

userdb {
  driver = passwd-file
  args = @DATA_DIR@/dovecot/users
  default_fields = uid=@SERVICE_USER@ gid=@SERVICE_USER@ home=@BACKUP_ROOT@/maildir/%u
}

log_path = syslog
