# Dovecot 2.4 (Ubuntu 25.04+) — локальное хранилище бэкапов mail_backup.
# Заменяет /etc/dovecot/dovecot.conf целиком: на этом сервере Dovecot
# нужен только как хранилище, внешняя почта через него не ходит.
#
# Плейсхолдеры @...@ подставляет deploy/install.sh.
# ВНИМАНИЕ: шаблон ещё не проверен на живой Ubuntu 26.04 — проверить при деплое.

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols {
  imap = yes
}

# imapsync подключается с этого же сервера. @VIEW_LISTEN@ — IP сервера для просмотра
# почты клиентом (установщик, --imap-listen), пусто — только локально. Учётки imapsync
# пускаются только с 127.0.0.1 (allow_nets в файле учёток), просмотр — из сетей из панели
listen = 127.0.0.1@VIEW_LISTEN@
ssl = no
# Пароль в открытом виде допустим: соединение не покидает машину или идёт внутри VPN
auth_allow_cleartext = yes

# Maildir — по файлу на письмо: удобно для restic (дедупликация, инкременты)
mail_driver = maildir
mail_path = ~/Maildir
# Иерархия папок каталогами с разделителем «/», как у Яндекса и Mail.ru
mailbox_list_layout = fs

# Все ящики принадлежат пользователю сервиса — он же делает снимки restic
mail_uid = @SERVICE_USER@
mail_gid = @SERVICE_USER@
first_valid_uid = @SERVICE_UID@
last_valid_uid = @SERVICE_UID@

# ACL: учётки просмотра (группа mb-view, её выдаёт файл учёток) — только чтение,
# остальные — владельцы своих ящиков со всеми правами. Владельца прописываем явно:
# при наличии глобальных записей права по умолчанию могут не применяться
mail_plugins {
  acl = yes
}
acl_driver = vfile
acl owner {
  rights = lrwstipekxa
}
acl group-override=mb-view {
  rights = lr
}

namespace inbox {
  inbox = yes
  separator = /
}

# Учётки ящиков генерирует приложение (mail-backup dovecot-sync)
passdb passwd-file {
  passwd_file_path = @DATA_DIR@/dovecot/users
}

userdb passwd-file {
  passwd_file_path = @DATA_DIR@/dovecot/users
  fields {
    uid:default = @SERVICE_USER@
    gid:default = @SERVICE_USER@
    home:default = @BACKUP_ROOT@/maildir/%{user}
  }
}

log_path = syslog
